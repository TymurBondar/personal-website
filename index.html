<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tymur Bondar — Under Construction</title>
	<meta name="description" content="tymurbondar.com is under construction.">
	<meta name="robots" content="noindex">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000000'/%3E%3Crect x='10' y='10' width='6' height='6' fill='%23FF3000'/%3E%3C/svg%3E">
	<style>
		@font-face {
			font-family: "Inter";
			font-style: normal;
			font-weight: 900;
			font-display: swap;
			src: url("./assets/fonts/Inter-Black.woff2") format("woff2");
		}
		@font-face {
			font-family: "Inter";
			font-style: normal;
			font-weight: 500;
			font-display: swap;
			src: url("./assets/fonts/Inter-Medium.woff2") format("woff2");
		}
		*, *::before, *::after { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: flex;
			flex-direction: column;
			background: #ffffff;
			color: #000000;
			font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		main {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: clamp(1.25rem, 4vw, 2rem);
			border-top: 4px solid #000000;
		}
		.eyebrow {
			margin: 0 0 1rem;
			font-size: 0.8125rem;
			font-weight: 500;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0;
			font-size: min(10vw, 9rem);
			font-weight: 900;
			line-height: 0.95;
			letter-spacing: -0.03em;
			text-transform: uppercase;
			overflow-wrap: anywhere;
		}
		.accent { color: #ff3000; }
		footer {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: 1rem clamp(1.25rem, 4vw, 2rem);
			border-top: 2px solid #000000;
			font-size: 0.8125rem;
			font-weight: 500;
		}
		footer a { color: inherit; text-decoration: none; }
		footer a:hover { color: #ff3000; }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">tymurbondar.com</p>
		<h1>Under<br>construction<span class="accent">.</span></h1>
	</main>
	<footer>
		<span>Tymur Bondar</span>
		<a href="mailto:tymurbondar@outlook.com">tymurbondar@outlook.com</a>
	</footer>
</body>
</html>
